#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and custom directives

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
Color
VerbosePkgLists

# Pacman won't upgrade packages listed in IgnorePkg and members of IgnoreGroup
#IgnorePkg   =
#IgnoreGroup =

# NoUpgrade / NoExtract
#NoUpgrade   =
#NoExtract   =

# Misc options
#UseSyslog
#CheckSpace
#CleanMethod = KeepInstalled

SigLevel    = Required DatabaseNever
LocalFileSigLevel = Optional

#
# REPOSITORIES
#

#[core-testing]
#Include = /etc/pacman.d/mirrorlist

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

#[extra-testing]
#Include = /etc/pacman.d/mirrorlist

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch

#[multilib-testing]
#Include = /etc/pacman.d/mirrorlist

#[multilib]
#Include = /etc/pacman.d/mirrorlist

#
# CACHYOS REPOS
# Required for: mango-wm, librewolf-bin, and other CachyOS packages
#
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist
SigLevel = Optional TrustAll DatabaseNever
